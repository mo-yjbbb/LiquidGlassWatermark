name: LiquidGlassWatermark
options:
  bundleIdPrefix: com.localwatermark
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  LiquidGlassWatermark:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Intents
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localwatermark.liquidglass
        PRODUCT_NAME: LiquidGlassWatermark
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - LiquidGlassWatermarkTests
  LiquidGlassWatermarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LiquidGlassWatermark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

