name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build without signing
        run: |
          xcodebuild \
            -project LiquidGlassWatermark.xcodeproj \
            -scheme LiquidGlassWatermark \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/LiquidGlassWatermark.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LiquidGlassWatermark-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassWatermark-unsigned
          path: LiquidGlassWatermark-unsigned.ipa

